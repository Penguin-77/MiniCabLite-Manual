version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.10"

  apt_packages:
    - fonts-liberation
    - fonts-noto-cjk
    - fonts-noto-cjk-extra
    - texlive-lang-chinese
    - texlive-xetex
    - texlive-latex-extra
    - latexmk
    - librsvg2-bin

  jobs:
    post_build:
      - >-
        find "$READTHEDOCS_OUTPUT/pdf"
        -depth
        -mindepth 1
        ! -path "$READTHEDOCS_OUTPUT/pdf/JAKA MiniCab Lite硬件用户手册.pdf"
        -delete

python:
  install:
    - requirements: requirements.txt

sphinx:
  configuration: source/conf.py

formats:
  - pdf
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.10"

  apt_packages:
    - fonts-liberation
    - fonts-noto-cjk
    - fonts-noto-cjk-extra
    - texlive-lang-chinese
    - texlive-xetex
    - texlive-latex-extra
    - latexmk
    - librsvg2-bin

  jobs:
    post_build:
      - >-
        test -f "$READTHEDOCS_OUTPUT/pdf/minicablite-manual.pdf"
        && cp "$READTHEDOCS_OUTPUT/pdf/minicablite-manual.pdf"
        /tmp/minicablite-manual.pdf
        && find "$READTHEDOCS_OUTPUT/pdf" -depth -mindepth 1 -delete
        && mv /tmp/minicablite-manual.pdf
        "$READTHEDOCS_OUTPUT/pdf/minicablite-manual.pdf"

python:
  install:
    - requirements: requirements.txt

sphinx:
  configuration: source/conf.py

formats:
  - pdf